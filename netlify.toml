[build]
command = "npm install && npm run build"
publish = "dist"

# Nitro will automatically use the 'netlify' preset when NETLIFY env var is set
# and output server function to .netlify/functions-internal/

# Secrets scanning configuration
# Omit VITE_* keys - these are public and intentionally inlined into the client bundle
[build.environment]
SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_URL"
